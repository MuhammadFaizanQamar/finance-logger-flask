{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
    <div class="card">
        <div class="card-body">

            <h3 class="mb-4">Edit Transaction</h3>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Amount</label>
                    <input
                        type="number"
                        step="0.01"
                        name="amount"
                        class="form-control"
                        value="{{ transaction.amount }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Type</label>

                    <select name="type" class="form-select">

                        <option value="income"
                            {% if transaction.type == 'income' %}
                                selected
                            {% endif %}>
                            Income
                        </option>

                        <option value="expense"
                            {% if transaction.type == 'expense' %}
                                selected
                            {% endif %}>
                            Expense
                        </option>

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input
                        type="text"
                        name="category"
                        class="form-control"
                        value="{{ transaction.category }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <input
                        type="text"
                        name="description"
                        class="form-control"
                        value="{{ transaction.description }}">
                </div>

                <button type="submit" class="btn btn-warning w-100">
                    Update Transaction
                </button>

            </form>

        </div>
    </div>

</div>

</div>

{% endblock %}
