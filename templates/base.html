<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Finance Logger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/">Finance Logger</a>
    <div>
        {% if current_user.is_authenticated %}
            <span class="text-white me-3">{{ current_user.username }}</span>
            <a href="/add" class="btn btn-success btn-sm me-2">+ Add Transaction</a>
            <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Logout</a>
        {% else %}
            <a href="{{ url_for('login') }}" class="btn btn-outline-light btn-sm me-2">Login</a>
            <a href="{{ url_for('signup') }}" class="btn btn-light btn-sm">Sign Up</a>
        {% endif %}
    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
